[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evlab"
version = "0.1.0"
description = "EV-Traction Lab: virtual lab for an induction-motor EV traction drive (ME3, ENP Algiers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyqtgraph",
    "PySide6",
    "reportlab",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
nsga = ["pymoo"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
